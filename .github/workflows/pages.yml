# Publishes the web folder as the GitHub Pages site. It runs only when started by hand (Actions, Deploy to Pages, Run workflow), so
# nothing goes public before the legal notice in web/legal.html is filled in. Later "workflow_dispatch" can be extended by a push trigger.
name: Deploy to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
