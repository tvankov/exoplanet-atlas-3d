# Tests of the page without a browser (tests/): the pure parts, the texts in four languages, the data of the pictures and the files of the
# page. Runs when the code, the pages, the data or the tests change.
name: Unit tests

on:
  push:
    paths:
      - "web/*.js"
      - "web/*.html"
      - "web/data/**"
      - "tests/**"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "web/*.js"
      - "web/*.html"
      - "web/data/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs
